x-db-environment: &db-environment
  POSTGRES_DB: ${DB_NAME:-rdr}
  DB_NAME: ${DB_NAME:-rdr}
  POSTGRES_USER: ${POSTGRES_USER:-ensreg-usr}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rdr-local-password}

services:
  db:
    build:
      context: ..
      dockerfile: containers/db.Containerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-14}
    environment:
      <<: *db-environment
      PGDATA: /var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_SERVICE_PORT_TEST:-2345}:5432'
    # Disposable database: stopping the container discards changes not dumped.
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    healthcheck:
      # TCP becomes available after the initialization scripts finish.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 60

  db-validate:
    profiles: [tools]
    build:
      context: ..
      dockerfile: containers/db.Containerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-14}
    environment: *db-environment
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    entrypoint: ["/usr/local/bin/validate-db"]

  db-dump:
    profiles: [tools]
    image: docker.io/library/postgres:${POSTGRES_VERSION:-14}
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: ${DB_NAME:-rdr}
      PGUSER: ${POSTGRES_USER:-ensreg-usr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-rdr-local-password}
    volumes:
      - type: bind
        source: ../db
        target: /db
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      db:
        condition: service_healthy

  schemaspy-docs:
    profiles: [tools]
    image: docker.io/schemaspy/schemaspy:7.0.2
    user: "${SCHEMASPY_UID:-1000}:${SCHEMASPY_GID:-1000}"
    # The wrapper selects keep-id for rootless Podman and host for Docker.
    userns_mode: "${SCHEMASPY_USERNS:-host}"
    volumes:
      - type: bind
        source: ${SCHEMASPY_OUTPUT_DIR:-../docs/schemaspy}
        target: /output
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      db:
        condition: service_healthy
    command:
      - -t
      - pgsql11
      - -host
      - db
      - -port
      - '5432'
      - -db
      - ${DB_NAME:-rdr}
      - -u
      - ${POSTGRES_USER:-ensreg-usr}
      - -p
      - ${POSTGRES_PASSWORD:-rdr-local-password}
      - -s
      - public
      # Keep documentation focused on structure, independent of snapshot row counts.
      - -norows
