services:
  db:
    build:
      context: ..
      dockerfile: containers/db.Containerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION}
        DB_NAME: ${DB_NAME}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_USER: ${POSTGRES_USER}
        PGDATA: ${PGDATA}
    env_file: ../.env
    ports:
      - '${DB_SERVICE_PORT_TEST}:5432'

  db-dump:
    build:
      context: ..
      dockerfile: containers/db-dump.Containerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION}
        DB_NAME: ${DB_NAME}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_USER: ${POSTGRES_USER}
    env_file: ../.env
    volumes:
      - type: bind
        source: ../db
        target: /db
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      - db
    entrypoint: [ "/dump/dump.sh" ]

  schemapy-docs:
    image: docker.io/schemaspy/schemaspy:7.0.2
    env_file: ../.env
    volumes:
      - type: bind
        source: ../docs/schemaspy
        target: /output
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      - db
    command: [ "-t", "pgsql11", "--user", "$POSTGRES_USER", "-db", "$DB_NAME", "-port", "$DB_SERVICE_PORT", "-host", "db", "-p", "$POSTGRES_PASSWORD" ]

  sut:
    image: docker.io/library/postgres:${POSTGRES_VERSION}
    env_file: ../.env
    depends_on:
      - db
    command: [ "bash", "/var/run_tests.sh" ]
    volumes:
      - "../run_tests.sh:/var/run_tests.sh"
      - "db:${PGDATA}"

volumes:
  db:
    driver: local


