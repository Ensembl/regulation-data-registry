x-db-environment: &db-environment
  POSTGRES_DB: ${DB_NAME:-rdr}
  DB_NAME: ${DB_NAME:-rdr}
  POSTGRES_USER: ${POSTGRES_USER:-regulation_usr}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rdr-local-password}

services:
  db:
    build:
      context: ..
      dockerfile: containers/db.Containerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-14}
    environment:
      <<: *db-environment
      PGDATA: /var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_SERVICE_PORT_TEST:-2345}:5432'
    # Disposable database: stopping the container discards changes not dumped.
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    healthcheck:
      # TCP becomes available after the initialization scripts finish.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 60

  db-dump:
    build:
      context: ..
      dockerfile: containers/db-dump.Containerfile
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-14}
    environment:
      <<: *db-environment
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    volumes:
      - type: bind
        source: ../db
        target: /db
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      db:
        condition: service_healthy

  schemapy-docs:
    image: docker.io/schemaspy/schemaspy:7.0.2
    volumes:
      - type: bind
        source: ../docs/schemaspy
        target: /output
        bind:
          create_host_path: false
          selinux: z
    depends_on:
      db:
        condition: service_healthy
    command: ["-t", "pgsql11", "--user", "${POSTGRES_USER:-regulation_usr}", "-db", "${DB_NAME:-rdr}", "-port", "5432", "-host", "db", "-p", "${POSTGRES_PASSWORD:-rdr-local-password}"]
